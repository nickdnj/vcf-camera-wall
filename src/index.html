<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VCF Camera Wall</title>
<style>
  :root{
    --bg:#0a0d10; --tile:#0f1319; --line:#1e2732; --edge:#2a3644;
    --text:#e8eef4; --muted:#8998a8; --accent:#39d98a; --warn:#ffb454; --bad:#ff5c5c;
    --label-bg:rgba(6,9,12,.72);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
  body.cursor-hidden{cursor:none}

  /* screen rotation (CSS) */
  body.rot90,body.rot270{width:100vh;height:100vw}
  body.rot90{transform:rotate(90deg) translateY(-100%);transform-origin:top left}
  body.rot180{transform:rotate(180deg)}
  body.rot270{transform:rotate(270deg) translateX(-100%);transform-origin:top left}

  header{display:flex;align-items:center;gap:14px;padding:8px 16px;background:#0c1015;border-bottom:1px solid var(--line);flex:0 0 auto;z-index:5}
  header .brand{font-weight:700;letter-spacing:.3px;font-size:15px}
  header .brand .dot{color:var(--accent)}
  header .status{color:var(--muted);font-size:12.5px}
  header .spacer{margin-left:auto}
  header .clock{font-variant-numeric:tabular-nums;font-size:14px;color:var(--text);letter-spacing:.4px}
  .btn{background:#151b22;color:var(--text);border:1px solid var(--edge);border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.active{background:#12331f;border-color:var(--accent);color:var(--accent)}
  .btngroup{display:flex;gap:6px}

  main{flex:1 1 auto;min-height:0;padding:8px;overflow:hidden}
  .wall{height:100%;display:grid;gap:8px}
  .wall.grid[data-n="1"]{grid-template-columns:1fr}
  .wall.grid[data-n="2"]{grid-template-columns:1fr 1fr}
  .wall.grid[data-n="3"]{grid-template-columns:1fr 1fr 1fr}
  .wall.grid[data-n="4"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .wall.grid[data-n="5"],.wall.grid[data-n="6"]{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr}
  .wall.grid[data-n="7"],.wall.grid[data-n="8"],.wall.grid[data-n="9"]{grid-template-columns:1fr 1fr 1fr;grid-template-rows:repeat(3,1fr)}
  .wall.grid[data-n="10"],.wall.grid[data-n="11"],.wall.grid[data-n="12"]{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr)}

  .wall.spotlight{grid-template-columns:1fr 240px;grid-template-rows:1fr;grid-auto-rows:1fr}
  .wall.spotlight .tile:first-child{grid-row:1 / -1}
  .wall.spotlight .rail{display:flex;flex-direction:column;gap:8px;min-height:0;grid-column:2;grid-row:1}
  .wall.solo{grid-template-columns:1fr}

  .tile{position:relative;background:var(--tile);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:0;display:flex;align-items:center;justify-content:center}
  .tile.selected{border-color:var(--accent)}
  .tile img{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  .tile .label{position:absolute;left:0;bottom:0;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--label-bg);
    border-top-right-radius:8px;font-size:13px;max-width:90%}
  .tile .label .name{font-weight:600}
  .tile .label .ip{color:var(--muted);font-size:11.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .tile .badge{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:20px;
    background:var(--label-bg);font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
  .tile .badge .led{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .tile[data-state="live"] .badge .led{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .tile[data-state="live"] .badge{color:var(--accent)}
  .tile[data-state="connecting"] .badge .led{background:var(--warn);animation:pulse 1s infinite}
  .tile[data-state="connecting"] .badge{color:var(--warn)}
  .tile[data-state="offline"] .badge .led{background:var(--bad)}
  .tile[data-state="offline"] .badge{color:var(--bad)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .tile .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:#080b0e;color:var(--muted);text-align:center;padding:20px}
  .tile[data-state="offline"] .overlay{display:flex}
  .tile .overlay .big{color:var(--text);font-size:15px;font-weight:600}
  .tile .overlay .sub{font-size:12.5px}
  .tile .num{position:absolute;top:8px;left:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--label-bg);padding:2px 7px;border-radius:6px}

  footer{flex:0 0 auto;padding:5px 16px;background:#0c1015;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;display:flex;gap:16px;align-items:center}
  footer kbd{background:#151b22;border:1px solid var(--edge);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--text)}
  footer .spacer{margin-left:auto}
  body.kiosk header,body.kiosk footer{display:none}

  /* QR "scan to manage" badge */
  #qr{position:fixed;right:14px;bottom:14px;z-index:20;display:none;align-items:center;gap:10px;
    background:rgba(6,9,12,.82);border:1px solid var(--edge);border-radius:12px;padding:9px 12px;backdrop-filter:blur(3px)}
  #qr.show{display:flex}
  #qr img{width:78px;height:78px;background:#fff;border-radius:6px;padding:4px;display:block}
  #qr .meta{font-size:11px;color:var(--muted);max-width:150px;line-height:1.35}
  #qr .meta b{color:var(--text);font-size:12px;display:block;margin-bottom:2px}
  #qr .meta .url{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--accent);word-break:break-all}
</style>
</head>
<body>
<header>
  <span class="brand">Camera Wall <span class="dot">●</span></span>
  <span class="status" id="status">starting…</span>
  <span class="spacer"></span>
  <div class="btngroup">
    <button class="btn" data-layout="grid">Grid</button>
    <button class="btn" data-layout="spotlight">Spotlight</button>
    <button class="btn" data-layout="solo">Solo</button>
  </div>
  <button class="btn" id="reloadBtn" title="Reconnect all (R)">⟳ Reconnect</button>
  <button class="btn" id="fsBtn" title="Fullscreen (F)">⛶ Fullscreen</button>
  <span class="clock" id="clock"></span>
</header>

<main><div class="wall" id="wall"></div></main>

<footer>
  <span><kbd>F</kbd> fullscreen</span>
  <span><kbd>G</kbd> grid</span>
  <span><kbd>S</kbd> spotlight</span>
  <span><kbd>1</kbd>–<kbd>9</kbd> solo camera</span>
  <span><kbd>R</kbd> reconnect all</span>
  <span><kbd>Esc</kbd> exit fullscreen</span>
  <span class="spacer"></span>
  <span id="foot-meta"></span>
</footer>

<div id="qr">
  <img id="qrImg" alt="admin QR">
  <div class="meta"><b>Manage on your phone</b>Same Wi-Fi, then scan:<span class="url" id="qrUrl"></span></div>
</div>

<script src="config.js"></script>
<script>
(function(){
  "use strict";
  var QUALITY = {
    native:"fps=12", low:"resolution=640x480&fps=8",
    medium:"resolution=1280x720&fps=12", high:"resolution=1920x1080&fps=15",
  };
  var CFG = null, cams = [], tiles = [], layout = "grid", soloIndex = 0, curVersion = null, rotateTimer = null, serverId = null;

  var wall = document.getElementById("wall");
  var statusEl = document.getElementById("status");
  var footMeta = document.getElementById("foot-meta");

  function qFor(cam){ return QUALITY[cam.quality || CFG.quality] || QUALITY.native; }
  function streamUrl(cam){
    if (cam.stream) return cam.stream;
    var q = qFor(cam);
    return "http://" + cam.ip + "/axis-cgi/mjpg/video.cgi" + (q ? "?" + q : "");
  }
  function bust(url){ return url + (url.indexOf("?")>=0 ? "&":"?") + "_t=" + Date.now(); }

  // ---------- config load + live update ----------
  function normalize(c){
    // accept both new API shape and legacy window.WALL_CONFIG
    if (c.site) return c;
    return {
      site:{ name:(c.title||"Camera Wall").replace(/\s*—.*$/,""), subtitle:"" },
      cameras:(c.cameras||[]).map(function(x){ x.enabled = x.enabled!==false; return x; }),
      layout:c.layout||"grid", quality:c.quality||"native",
      display:{ showClock:c.showClock!==false, showQR:false, rotation:0 },
      behavior:{ reconnectDelayMs:c.reconnectDelayMs, maxReconnectDelayMs:c.maxReconnectDelayMs,
                 watchdogReloadMin:c.watchdogReloadMin, hideCursorAfterSec:c.hideCursorAfterSec, rotateSec:0 },
      version:0
    };
  }
  function loadConfig(){
    return fetch("/api/config",{cache:"no-store"}).then(function(r){ return r.json(); })
      .catch(function(){ return normalize(window.WALL_CONFIG||{cameras:[]}); });
  }

  function applyChrome(){
    var name = (CFG.site&&CFG.site.name) || "Camera Wall";
    document.title = name;
    document.querySelector(".brand").firstChild.nodeValue = name + " ";
    // rotation
    document.body.classList.remove("rot90","rot180","rot270");
    var rot = (CFG.display&&CFG.display.rotation)|0;
    if (rot) document.body.classList.add("rot"+rot);
    // QR badge
    var qr = document.getElementById("qr");
    if (CFG.display && CFG.display.showQR && CFG.adminUrl){
      document.getElementById("qrImg").src = "/api/qr?_t=" + Date.now();
      document.getElementById("qrUrl").textContent = CFG.adminUrl;
      qr.classList.add("show");
    } else { qr.classList.remove("show"); }
  }

  function b(k,d){ return (CFG.behavior && CFG.behavior[k]!=null) ? CFG.behavior[k] : d; }

  // ---------- tiles ----------
  function buildTiles(){
    tiles.forEach(function(t){ if(t.timer) clearTimeout(t.timer); });
    tiles = []; wall.innerHTML = "";
    cams = (CFG.cameras||[]).filter(function(c){ return c.enabled!==false; });
    cams.forEach(function(cam,i){
      var el = document.createElement("div");
      el.className = "tile"; el.dataset.state = "connecting";
      el.innerHTML =
        '<span class="num">'+(i+1)+'</span><img alt="">'+
        '<div class="overlay"><div class="big">Signal lost</div>'+
          '<div class="sub">'+esc(cam.name)+' · '+esc(cam.ip)+'</div><div class="sub">reconnecting…</div></div>'+
        '<div class="badge"><span class="led"></span><span class="txt">connecting</span></div>'+
        '<div class="label"><span class="name">'+esc(cam.name)+'</span><span class="ip">'+esc(cam.ip)+'</span></div>';
      var img = el.querySelector("img");
      var t = { cam:cam, el:el, img:img, state:"connecting", timer:null, delay:b("reconnectDelayMs",3000) };
      tiles.push(t);
      img.addEventListener("load", function(){ setState(t,"live"); t.delay=b("reconnectDelayMs",3000); });
      img.addEventListener("error", function(){ onError(t); });
      el.addEventListener("click", function(){
        if (layout==="solo"){ soloIndex=i; render(); } else if (layout==="spotlight"){ soloIndex=i; render(); }
      });
    });
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  function setState(t,s){ t.state=s; t.el.dataset.state=s; var x=t.el.querySelector(".badge .txt"); if(x)x.textContent=s; updateStatus(); }
  function onError(t){
    setState(t,"connecting");
    if (t.timer) clearTimeout(t.timer);
    t.timer = setTimeout(function(){
      connect(t); t.delay = Math.min((t.delay||3000)*1.6, b("maxReconnectDelayMs",30000));
      setTimeout(function(){ if(t.state!=="live") setState(t,"offline"); }, 6000);
    }, t.delay||3000);
  }
  function connect(t){ t.img.src = bust(streamUrl(t.cam)); }
  function connectAll(){ tiles.forEach(function(t){ if(t.timer)clearTimeout(t.timer); t.delay=b("reconnectDelayMs",3000); connect(t); setState(t,"connecting"); }); }
  function updateStatus(){
    var live = tiles.filter(function(t){return t.state==="live";}).length;
    statusEl.textContent = live+" / "+tiles.length+" cameras live";
    statusEl.style.color = live===tiles.length ? "var(--accent)" : (live===0 ? "var(--bad)":"var(--warn)");
  }

  // ---------- layout ----------
  function render(){
    wall.className = "wall " + layout;
    tiles.forEach(function(t){ if(t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    var rail = wall.querySelector(".rail"); if(rail) rail.remove();
    wall.innerHTML = "";
    if (layout==="grid"){
      wall.dataset.n = tiles.length;
      tiles.forEach(function(t){ t.el.classList.remove("selected"); wall.appendChild(t.el); });
    } else if (layout==="spotlight"){
      wall.dataset.n=""; var main=tiles[soloIndex]||tiles[0];
      if(main){ main.el.classList.add("selected"); wall.appendChild(main.el); }
      var r=document.createElement("div"); r.className="rail";
      tiles.forEach(function(t){ if(t!==main){ t.el.classList.remove("selected"); r.appendChild(t.el);} });
      wall.appendChild(r);
    } else {
      wall.dataset.n="1"; var s=tiles[soloIndex]||tiles[0]; if(s){ s.el.classList.remove("selected"); wall.appendChild(s.el);} }
    document.querySelectorAll("[data-layout]").forEach(function(bt){ bt.classList.toggle("active", bt.dataset.layout===layout); });
    footMeta.textContent = cams.length+" cameras · "+(CFG.quality||"native")+" quality";
    setupRotateCycle();
  }
  function setLayout(l){ layout=l; render(); }
  document.querySelectorAll("[data-layout]").forEach(function(bt){ bt.addEventListener("click", function(){ setLayout(bt.dataset.layout); }); });

  // cycle cameras in solo/spotlight if behavior.rotateSec > 0
  function setupRotateCycle(){
    if (rotateTimer){ clearInterval(rotateTimer); rotateTimer=null; }
    var sec = b("rotateSec",0)|0;
    if (sec>0 && (layout==="solo"||layout==="spotlight") && tiles.length>1){
      rotateTimer = setInterval(function(){ soloIndex=(soloIndex+1)%tiles.length; render(); }, sec*1000);
    }
  }

  // ---------- fullscreen / clock / cursor ----------
  function toggleFullscreen(){
    if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||function(){}).call(document.documentElement); }
    else { (document.exitFullscreen||function(){}).call(document); }
  }
  document.getElementById("fsBtn").addEventListener("click", toggleFullscreen);
  document.getElementById("reloadBtn").addEventListener("click", connectAll);
  document.addEventListener("fullscreenchange", function(){ document.body.classList.toggle("kiosk", !!document.fullscreenElement); });

  var clock=document.getElementById("clock");
  setInterval(function(){
    if(!(CFG&&CFG.display&&CFG.display.showClock)){ clock.textContent=""; return; }
    clock.textContent = new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  },1000);

  var cursorTimer=null;
  function armCursor(){
    document.body.classList.remove("cursor-hidden");
    if(cursorTimer) clearTimeout(cursorTimer);
    var s=b("hideCursorAfterSec",5);
    if(s>0) cursorTimer=setTimeout(function(){ document.body.classList.add("cursor-hidden"); }, s*1000);
  }
  document.addEventListener("mousemove", armCursor);

  document.addEventListener("keydown", function(e){
    var k=e.key.toLowerCase();
    if(k==="f"){ e.preventDefault(); toggleFullscreen(); }
    else if(k==="g") setLayout("grid");
    else if(k==="s") setLayout("spotlight");
    else if(k==="r") connectAll();
    else if(/^[1-9]$/.test(k)){ var idx=parseInt(k,10)-1; if(idx<tiles.length){ soloIndex=idx; setLayout("solo"); } }
  });

  // watchdog soft reload
  var watchdog=null;
  function armWatchdog(){ if(watchdog) clearInterval(watchdog); var m=b("watchdogReloadMin",10); if(m>0) watchdog=setInterval(connectAll, m*60*1000); }

  // ---------- apply a freshly loaded config ----------
  function apply(cfg){
    CFG = cfg.site ? cfg : normalize(cfg);
    curVersion = CFG.version;
    if (CFG.serverId) serverId = CFG.serverId;
    layout = CFG.layout || "grid";
    if (soloIndex >= (CFG.cameras||[]).length) soloIndex = 0;
    applyChrome(); buildTiles();
    if(!cams.length){ statusEl.textContent="No cameras — open admin to add some"; statusEl.style.color="var(--bad)"; wall.innerHTML=""; return; }
    render(); connectAll(); armCursor(); armWatchdog();
  }

  // ---------- poll for config changes (admin edits apply live) ----------
  setInterval(function(){
    fetch("/api/config",{cache:"no-store"}).then(function(r){return r.json();}).then(function(c){
      if (serverId && c.serverId && c.serverId!==serverId){ location.reload(); return; }
      if (c && c.version!==curVersion){ apply(c); }
      // the LAN IP can change without a version bump (booted before the network came up)
      else if (c && c.adminUrl && c.adminUrl!==CFG.adminUrl){ CFG.adminUrl=c.adminUrl; CFG.lanIp=c.lanIp; applyChrome(); }
    }).catch(function(){});
  }, 7000);

  // ---------- go ----------
  loadConfig().then(apply);
})();
</script>
</body>
</html>
